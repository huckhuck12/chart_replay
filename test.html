<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Diagnostic Test</title>
<style>
  body { margin: 0; background: #0d1117; color: #fff; font-family: sans-serif; padding: 20px; }
  #status { padding: 10px; margin-bottom: 10px; border-radius: 4px; }
  .ok { background: #1a3a2a; color: #4caf50; }
  .err { background: #3a1a1a; color: #f44336; }
  .info { background: #1a2a3a; color: #64b5f6; }
  #chart { width: 100%; height: 400px; }
</style></head>
<body>
<h2>Diagnostic Test</h2>
<div id="status" class="info">Starting...</div>
<div id="chart"></div>
<script src="lightweight-charts.js"></script>
<script>
(function() {
  var $s = document.getElementById('status');
  function log(msg, cls) { $s.className = cls || 'info'; $s.textContent = msg; console.log(msg); }

  // Step 1: Check library
  if (typeof LightweightCharts === 'undefined') {
    log('FAIL: LightweightCharts not loaded! Script src="lightweight-charts.js" failed.', 'err');
    return;
  }
  log('OK: LightweightCharts loaded successfully', 'ok');

  // Step 2: Create chart
  var c = document.getElementById('chart');
  try {
    var chart = LightweightCharts.createChart(c, {
      width: c.clientWidth || 800, height: 400,
      layout: { background: { type: 'solid', color: '#0d1117' }, textColor: '#8b949e' },
      grid: { vertLines: { color: '#1c2128' }, horzLines: { color: '#1c2128' } },
    });
    log('OK: Chart created. Adding candle data...', 'ok');

    // Step 3: Add candle series
    var cs = chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350', borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });

    // Step 4: Generate test data
    var data = [];
    var price = 50000, now = Math.floor(Date.now() / 1000);
    for (var i = 0; i < 100; i++) {
      var t = now - (100 - i) * 300;
      var chg = (Math.random() - 0.48) * price * 0.008;
      var o = price, cl = price + chg;
      var hi = Math.max(o, cl) + Math.random() * Math.abs(chg) * 0.5;
      var lo = Math.min(o, cl) - Math.random() * Math.abs(chg) * 0.5;
      data.push({ time: t, open: o, high: hi, low: lo, close: cl });
      price = cl;
    }
    cs.setData(data);
    chart.timeScale().fitContent();
    log('SUCCESS: Chart displaying 100 candles!', 'ok');
  } catch(e) {
    log('FAIL: ' + e.message, 'err');
  }
})();
</script>
</body>
</html>
