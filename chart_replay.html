  ]},
  { key:'rsi',  name:'RSI 相对强弱',        color:'#79c0ff', params:[
      { key:'period', label:'周期', def:14 }
  ]},
  { key:'atr',  name:'ATR 平均真实波幅',    color:'#ff7043', params:[
      { key:'period', label:'周期', def:14 }
  ]},
  { key:'stoch',name:'KDJ 随机指标',        color:'#66bb6a', params:[
      { key:'k', label:'%K 周期', def:14 }, { key:'d', label:'%D 周期', def:3 }, { key:'smooth', label:'平滑', def:3 }
  ]},
  { key:'cci',  name:'CCI 商品通道指数',    color:'#e040fb', params:[
      { key:'period', label:'周期', def:20 }
  ]}
];

/** 设置面板打开前的参数快照——取消时恢复 */
let _settingsSnapshot = null;

/**
 * 渲染多线指标（MA/EMA）的参数行
 * @param {Object} ind - INDICATOR_DEFS 中的一项
 */
function renderMultiLines(ind) {
  const cfg   = state.indi[ind.key];
  const pid   = '_set_' + ind.key;
  const lines = cfg.lines || [];

  return lines.map((line, i) => `
    <div class="line-row">
      <input type="color" class="line-color" id="${pid}_color_${i}" value="${line.color || '#f0b90b'}" title="颜色">
      <span class="line-label">周期</span>
      <input type="number" id="${pid}_per_${i}" value="${line.period || 20}" min="2" max="999" step="1">
      <button class="btn-rm" onclick="removeLine('${ind.key}',${i})" title="删除此行">✕</button>
    </div>
  `).join('') + `
  <button class="btn-add-line" onclick="addLine('${ind.key}')">+ 添加均线</button>`;
}

/**
 * 打开指标设置弹窗
 * @param {string} [focusInd] - 可选，自动展开指定指标的参数面板
 */
function openSettings(focusInd) {
  // 保存快照以便取消恢复
  _settingsSnapshot = JSON.parse(JSON.stringify(state.indi));

  const content = document.getElementById('settingsContent');
  content.innerHTML = INDICATOR_DEFS.map(ind => {
    const cfg = state.indi[ind.key];
    const pid = '_set_' + ind.key;
    let bodyHTML;

    if (ind.type === 'multi') {
      bodyHTML = renderMultiLines(ind);
    } else {
      bodyHTML = ind.params.map(p => `
        <div class="param-row">
          <label>${p.label}</label>
          <input type="number" id="${pid}_${p.key}" value="${cfg[p.key] || p.def}" min="2" max="200" step="1">
        </div>
      `).join('');
    }

    return `<div class="indicator-group">
      <div class="group-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span style="color:${ind.color}">● ${ind.name}</span>
        <div class="toggle-sw ${cfg.on ? 'on' : ''}" id="${pid}_toggle"
             onclick="event.stopPropagation();toggleSettingSwitch('${ind.key}','${pid}')"></div>
      </div>
      <div class="group-body ${focusInd === ind.key ? 'open' : ''}">
        ${bodyHTML}
        <div class="intv-filter">
          <label>仅周期:</label>
          <input type="text" id="${pid}_intvs" placeholder="留空=全部, 如 1h,4h,1d" value="${(cfg.onlyIntvs || []).join(',')}">
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('settingsOverlay').classList.add('show');
}

/**
 * 为多线指标添加一条新线（随机颜色）
 */
function addLine(key) {
  const newColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
  state.indi[key].lines.push({ period: 21, color: newColor });
  openSettings(key);  // 重新渲染以显示新行
}

/**
 * 删除多线指标中的一条线（至少保留1条）
 */
function removeLine(key, i) {
  if (state.indi[key].lines.length <= 1) return;
  state.indi[key].lines.splice(i, 1);
  openSettings(key);
}

/**
 * 弹窗内切换指标的开关状态
 */
function toggleSettingSwitch(key, pid) {
  state.indi[key].on = !state.indi[key].on;
  const sw = document.getElementById(pid + '_toggle');
  sw.classList.toggle('on', state.indi[key].on);
}

/**
 * 应用设置——读取弹窗所有输入值 → 更新 state.indi → 刷新图表
 */
function applySettings() {
  const allIndis = ['ma','ema','bb','macd','rsi','atr','stoch','cci'];

  for (const key of allIndis) {
    const cfg = state.indi[key];
    const pid = '_set_' + key;

    // 读取开关状态
    const sw = document.getElementById(pid + '_toggle');
    if (sw) cfg.on = sw.classList.contains('on');

    if (key === 'ma' || key === 'ema') {
      // 多线指标：逐行读取周期和颜色
      const newLines = [];
      let i = 0;
      while (true) {
        const perEl   = document.getElementById(pid + '_per_'   + i);
        const colorEl = document.getElementById(pid + '_color_' + i);
        if (!perEl) break;
        newLines.push({
          period: parseFloat(perEl.value) || 20,
          color:  colorEl ? colorEl.value : '#f0b90b'
        });
        i++;
      }
      if (newLines.length > 0) cfg.lines = newLines;
    } else {
      // 单参数指标：读取每个参数的输入值
      for (const p of Object.keys(cfg).filter(k => k !== 'on' && k !== 'lines' && k !== 'onlyIntvs')) {
        const inp = document.getElementById(pid + '_' + p);
        if (inp) cfg[p] = parseFloat(inp.value) || cfg[p];
      }
    }

    // 读取时间周期过滤
    const intvEl = document.getElementById(pid + '_intvs');
    if (intvEl) {
      cfg.onlyIntvs = intvEl.value.split(',').map(s => s.trim()).filter(Boolean);
    }
  }

  // 同步芯片开关状态
  document.querySelectorAll('#chipRow .chip').forEach(chip => {
    const ind = chip.dataset.ind;
    if (ind && state.indi[ind]) {
      chip.classList.toggle('on',  state.indi[ind].on);
      chip.classList.toggle('off', !state.indi[ind].on);
    }
  });

  _settingsSnapshot = null;
  updateAllIndicators();
  document.getElementById('settingsOverlay').classList.remove('show');
  // 保存指标设置到 localStorage
  localStorage.setItem('ct_indi_settings', JSON.stringify(state.indi));
  toast('指标参数已更新', 'success');
}

/**
 * 取消设置——恢复快照，关闭弹窗
 */
function closeSettings() {
  if (_settingsSnapshot) {
    state.indi = _settingsSnapshot;
    _settingsSnapshot = null;
  }
  document.getElementById('settingsOverlay').classList.remove('show');
}

// ║ 11. 画线工具  水平线 / 趋势线 / 清除                          ║
// ╚══════════════════════════════════════════════════════════════╝

/**
 * 清除所有已绘制的画线
 */
function clearDrawings() {
  state.draws.forEach(d => {
    const series = Array.isArray(d.series) ? d.series : [d.series];
    series.forEach(s => { try { state.chart.removeSeries(s); } catch (e) {} });
  });
  state.draws = [];
  state.drawingMode = null;
  state.dragState = null;
  closeContextMenu();
  removePreviewSeries();
  toast('画线已清除', 'info');
}

/**
 * 关闭右键菜单
 */
function closeContextMenu() {
  document.getElementById('ctxMenu').classList.remove('show');
  state._ctxDrawingIndex = null;
}

/**
 * 将两个画线数据点按 time 升序排列
 * lightweight-charts 要求 series 数据按 time 升序，从右往左画线时
 * 若不做排序会导致图表渲染崩溃、K线消失
 * @param {Object} a - 数据点 {time, value}
 * @param {Object} b - 数据点 {time, value}
 * @returns {Object[]} 升序排列的数据点数组
 */
function sortedData(a, b) {
  return a.time <= b.time ? [a, b] : [b, a];
}

/**
 * 吸附到最近的 OHLC 价格
 * 在画线模式下，自动将价格吸附到最近K线的 O/H/L/C 值
 * @param {number} time - 当前K线时间戳
 * @param {number} price - 原始价格
 * @param {number} [toleranceRatio=0.15] - 吸附容差比例（相对于K线波幅）
 * @returns {number} 吸附后的价格
 */
function snapToOHLC(time, price, toleranceRatio = 0.15) {
  const data = state.allData;
  if (!data || data.length === 0) return price;
  const candle = data.find(d => d.time === time);
  if (!candle) return price;
  const range = candle.high - candle.low;
  if (range <= 0) return price;
  const tolerance = range * toleranceRatio;
  const candidates = [
    { value: candle.open, label: 'O' },
    { value: candle.high, label: 'H' },
    { value: candle.low, label: 'L' },
    { value: candle.close, label: 'C' }
  ];
  let best = { value: price, diff: Infinity };
  for (const c of candidates) {
    const diff = Math.abs(c.value - price);
    if (diff < tolerance && diff < best.diff) {
      best = { value: c.value, diff, label: c.label };
    }
  }
  return best.value;
}

// ══════════════════════════════════════════════════════════════
//  画线预览 & 拖拽辅助
// ══════════════════════════════════════════════════════════════

/**
 * 清除实时预览线
 */
/**
 * 复用式预览 series 管理
 * 避免在 crosshairMove 中每帧 add/remove series（这会触发 lightweight-charts
 * 内部渲染 bug，导致 K 线/图表消失）。改为：进入画线模式后预创建、复用 series，
 * 移动鼠标只 setData，真正离开画线模式时才 remove。
 */

/**
 * 确保预览 series 池至少有 n 条可用，不足则补建（复用模式专用）
 * @param {number} n - 需要的条数
 */
function ensurePreviewLines(n) {
  while (state.previewLines.length < n) {
    state.previewLines.push(state.chart.addLineSeries({
      color: '#ffffff', lineWidth: 1, lineStyle: 2,
      priceLineVisible: false, lastValueVisible: false
    }));
  }
}

/**
 * 清空预览数据（保留 series 以便复用），并返回可用预览 series 数组
 * @returns {Array} 预览 series 数组
 */
function clearPreview() {
  const lines = state.previewLines;
  lines.forEach(s => { try { s.setData([]); } catch (e) {} });
  return lines;
}

/**
 * 真正移除所有预览 series（画线完成 / 退出模式 / 清除时调用）
 */
function removePreviewSeries() {
  if (!state.chart) return;
  state.previewLines.forEach(s => { try { state.chart.removeSeries(s); } catch (e) {} });
  state.previewLines = [];
}

/**
 * 创建一条预览线 series（若已复用则直接返回可用的第 idx 条）
 * @param {number} idx - 复用池中的索引
 * @param {string} color
 * @param {number} lineStyle
 */
function makePreviewLine(idx, color = '#ffffff', lineStyle = 2) {
  ensurePreviewLines(idx + 1);
  const l = state.previewLines[idx];
  try { l.applyOptions({ color, lineWidth: 1, lineStyle }); } catch (e) {}
  return l;
}

/**
 * 更新画线预览（在 subscribeCrosshairMove 中调用）
 * @param {Object} param - subscribeCrosshairMove 的参数
 * @param {number} price - 当前鼠标位置的对应价格
 */
function updatePreview(param, price) {
  clearPreview(); // 清空数据但保留 series 复用
  if (!state.drawingMode || !param.time) return;
  const curTime = param.time;
  const endTime = state.allData[state.allData.length - 1].time;
  // 吸附价格到最近的 OHLC（预览时也显示吸附效果）
  const snappedPrice = snapToOHLC(curTime, price);

  if (state.drawingMode === 'hline') {
    // 水平线预览：一条横线（吸附到 OHLC）
    const l = makePreviewLine(0, '#f0b90b', 2);
    l.setData([{ time: curTime, value: snappedPrice }, { time: endTime, value: snappedPrice }]);
  } else if (state.drawingMode === 'trend') {
    if (state.drawStart) {
      // 趋势线预览：从起点到鼠标当前位置
      const l = makePreviewLine(0, '#ff9800', 1);
      l.setData(sortedData(
        { time: state.drawStart.time, value: state.drawStart.price },
        { time: curTime, value: snappedPrice }
      ));
    } else {
      // 还没选起点，显示一个点
      const l = makePreviewLine(0, '#ff9800', 2);
      l.setData([{ time: curTime, value: snappedPrice }, { time: endTime, value: snappedPrice }]);
    }
  } else if (state.drawingMode === 'rect') {
    if (state.drawStart) {
      // 矩形预览：4条边（复用池索引 0~3）
      const t1 = state.drawStart.time, p1 = state.drawStart.price;
      const t2 = curTime, p2 = snappedPrice;
      const lineColor = '#42a5f5';
      const pts = [
        sortedData({ time: t1, value: p1 }, { time: t2, value: p1 }),
        sortedData({ time: t2, value: p1 }, { time: t2, value: p2 }),
        sortedData({ time: t2, value: p2 }, { time: t1, value: p2 }),
        sortedData({ time: t1, value: p2 }, { time: t1, value: p1 })
      ];
      pts.forEach((seg, i) => {
        const l = makePreviewLine(i, lineColor, 1);
        l.setData(seg);
      });
    } else {
      const l = makePreviewLine(0, '#42a5f5', 2);
      l.setData([{ time: curTime, value: snappedPrice }, { time: endTime, value: snappedPrice }]);
    }
  } else if (state.drawingMode === 'fib') {
    if (state.drawStart) {
      // 斐波那契预览：7条水平线（复用池索引 0~6）
      const p1 = state.drawStart.price, p2 = snappedPrice;
      const t1 = state.drawStart.time, t2 = curTime;
      const isUp = p2 > p1;
      const range = Math.abs(p2 - p1);
      const levels = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
      const fibColors = ['#ff0000','#ff6b00','#ffcc00','#00cc00','#00ccff','#0066ff','#cc00ff'];
      levels.forEach((lvl, i) => {
        const priceAtLvl = isUp ? p2 - range * lvl : p1 + range * lvl;
        const l = makePreviewLine(i, fibColors[i], 2);
        l.setData(sortedData({ time: t1, value: priceAtLvl }, { time: t2, value: priceAtLvl }));
      });
    } else {
      const l = makePreviewLine(0, '#cc00ff', 2);
      l.setData([{ time: curTime, value: snappedPrice }, { time: endTime, value: snappedPrice }]);
    }
  }
}

/**
 * 判断鼠标点击是否靠近某条已有画线
 * @param {number} price - 点击价格
 * @param {Object} time - 点击时间
 * @returns {number|null} - 匹配的 drawings 索引，或 null
 */
function hitTestDrawing(price, time) {
  const tolerance = 0.005; // 价格容差比例
  for (let i = state.draws.length - 1; i >= 0; i--) {
    const d = state.draws[i];
    if (d.type === 'hline') {
      if (Math.abs(d.price - price) / (price || 1) < tolerance) return i;
    } else if (d.type === 'trend' || d.type === 'rect' || d.type === 'fib') {
      // 对于多点的图形，检查起点或终点的价格范围
      if (d.start && d.end) {
        const pRange = Math.abs(d.end.price - d.start.price);
        if (pRange > 0) {
          if (Math.abs(price - d.start.price) / pRange < tolerance * 5) return i;
          if (Math.abs(price - d.end.price) / pRange < tolerance * 5) return i;
        }
      }
    }
  }
  return null;
}

/**
 * 更新拖拽中的画线
 * @param {number} price - 当前鼠标价格
 * @param {Object} time - 当前鼠标时间
 */
function updateDragDrawing(price, time) {
  if (!state.dragState) return;
  const { index } = state.dragState;
  const d = state.draws[index];
  if (!d) { state.dragState = null; return; }

  const endTime = state.allData[state.allData.length - 1].time;

  if (d.type === 'hline') {
    d.price = price;
    d.series.setData([{ time, value: price }, { time: endTime, value: price }]);
  } else if (d.type === 'trend') {
    const dt = time - d.start.time;
    const dp = price - d.start.price;
    const newEnd = { time: d.end.time + dt, price: d.end.price + dp };
    d.start = { time, price };
    d.end = newEnd;
    d.series.setData([
      { time: d.start.time, value: d.start.price },
      { time: d.end.time, value: d.end.price }
    ]);
  } else if (d.type === 'rect') {
    const dt = time - d.start.time;
    const dp = price - d.start.price;
    const t1 = time, p1 = price;
    const t2 = d.end.time + dt, p2 = d.end.price + dp;
    d.start = { time: t1, price: p1 };
    d.end = { time: t2, price: p2 };
    const updateLine = (line, a, b) => {
      line.setData(sortedData(a, b));
    };
    updateLine(d.series[0], { time: t1, price: p1 }, { time: t2, price: p1 });
    updateLine(d.series[1], { time: t2, price: p1 }, { time: t2, price: p2 });
    updateLine(d.series[2], { time: t2, price: p2 }, { time: t1, price: p2 });
    updateLine(d.series[3], { time: t1, price: p2 }, { time: t1, price: p1 });
  } else if (d.type === 'fib') {
    const dt = time - d.start.time;
    const dp = price - d.start.price;
    const t1 = time, p1 = price;
    const t2 = d.end.time + dt, p2 = d.end.price + dp;
    d.start = { time: t1, price: p1 };
    d.end = { time: t2, price: p2 };
    const isUp = p2 > p1;
    const range = Math.abs(p2 - p1);
    const levels = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
    levels.forEach((lvl, i) => {
      const priceAtLvl = isUp ? p2 - range * lvl : p1 + range * lvl;
      d.series[i].setData(sortedData({ time: t1, value: priceAtLvl }, { time: t2, value: priceAtLvl }));
    });
  }
}

/**
 * 高亮选中的画线（拖拽时）
 * @param {Object} d - drawing 对象
 * @param {string} color - 高亮颜色
 * @returns {string[]} 保存的原始颜色数组
 */
function highlightDrawing(d, color) {
  const saved = [];
  const series = Array.isArray(d.series) ? d.series : [d.series];
  series.forEach(s => {
    try {
      saved.push(s.options().color);
      s.applyOptions({ color });
    } catch (e) {}
  });
  return saved;
}

/**
 * 恢复画线原始颜色
 */
function restoreDrawingColors(dragState) {
  if (!dragState || !dragState.savedColors) return;
  const d = state.draws[dragState.index];
  if (!d) return;
  const series = Array.isArray(d.series) ? d.series : [d.series];
  series.forEach((s, i) => {
    try {
      if (dragState.savedColors[i]) s.applyOptions({ color: dragState.savedColors[i] });
    } catch (e) {}
  });
}


/**
 * 删除当前选中的画线（Delete/Backspace 键触发）
 */
function deleteSelectedDrawing() {
  if (!state.dragState) return;
  const { index } = state.dragState;
  const d = state.draws[index];
  if (!d) { state.dragState = null; return; }
  const series = Array.isArray(d.series) ? d.series : [d.series];
  series.forEach(s => { try { state.chart.removeSeries(s); } catch (e) {} });
  state.draws.splice(index, 1);
  state.dragState = null;
  toast('画线已删除', 'info');
}

/**
 * 切换K线周期——重新拉取数据并重建图表
 */
async function loadInterval() {
  if (state.playing) stopPlay();
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('loading-msg').textContent = '切换周期...';
  try {
    await fetchKline();
    state.currentIndex = state.warmupOffset; // 从第1根可见K线开始
    rebuildChart();
    updateDatePickerRange();
    document.getElementById('loading').classList.add('hidden');
    toast(state.interval + ' 周期已加载', 'success');
  } catch (e) {
    document.getElementById('loading').classList.add('hidden');
    toast('加载失败: ' + e.message, 'error');
  }
}

// ║ 13. DOM 事件绑定 & 初始化入口                                ║
// ╚══════════════════════════════════════════════════════════════╝

document.addEventListener('DOMContentLoaded', () => {

  // ===== 交易对搜索框事件 =====
  const pairInput = document.getElementById('pairInput');
  const pairDD    = document.getElementById('pairDropdown');

  pairInput.addEventListener('focus', () => { filterPairs(); pairDD.classList.add('show'); });
  pairInput.addEventListener('input', () => { filterPairs(); });
  pairInput.addEventListener('click', () => { filterPairs(); pairDD.classList.add('show'); });
  pairInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { pairDD.classList.remove('show'); return; }
    if (e.key === 'Enter') {
      pairDD.classList.remove('show');
      const v = pairInput.value.toUpperCase().trim();
      // 精确匹配
      const exact = state.allSymbols.find(s => s.symbol === v);
      if (exact) { changeSymbol(exact.symbol); return; }
      // 尝试外汇匹配
      const fx = FOREX_PAIRS.find(f => f.symbol === v);
      if (fx) { changeSymbol(fx.symbol); return; }
      // 默认：追加 USDT 后缀匹配加密货币
      const crypto = state.allSymbols.find(s => s.symbol === v + 'USDT');
      if (crypto) { changeSymbol(crypto.symbol); return; }
      toast('未找到交易对: ' + v, 'error');
    }
  });

  // ===== 分类筛选下拉事件 =====
  document.getElementById('pairFilter').addEventListener('change', e => {
    setPairFilter(e.target.value);
    pairDD.classList.add('show'); // 选择分类后自动展开结果
  });

  // ===== 量比周期下拉事件 =====
  document.getElementById('volFilter').addEventListener('change', e => {
    const key = e.target.value;
    state.volFilter = key;
    if (key) {
      batchLoadVolChange(key); // 拉取并计算，完成后自动刷新
    } else {
      state.volMap = {}; state.volLoading = false;
      state.volFetchId++; // 取消进行中的请求
      renderPairDropdown(document.getElementById('pairInput').value, true);
    }
  });

  // ===== 排序方向（涨幅榜/跌幅榜）=====
  document.getElementById('volSort').addEventListener('change', e => {
    state.volSort = e.target.value;
    renderPairDropdown(document.getElementById('pairInput').value, true);
  });

  // 下拉项点击
  pairDD.addEventListener('click', e => {
    const item = e.target.closest('.item');
    if (!item) return;
    const sym = item.dataset.sym;
    pairInput.value = sym;
    pairDD.classList.remove('show');
    changeSymbol(sym);
  });

  // 点击外部关闭下拉
  document.addEventListener('click', e => {
    if (!e.target.closest('.pair-wrap')) pairDD.classList.remove('show');
  });

  // ===== 指标芯片点击 —— 切换开关 / 齿轮打开设置 =====
  document.getElementById('chipRow').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const ind = chip.dataset.ind;
    // 点击齿轮 → 打开设置面板
    if (e.target.closest('.gear')) { openSettings(ind); return; }
    // 点击芯片主体 → 切换开关
    state.indi[ind].on = !state.indi[ind].on;
    chip.classList.toggle('on',  state.indi[ind].on);
    chip.classList.toggle('off', !state.indi[ind].on);
    updateAllIndicators();
  });

  // ===== 周期按钮 =====
  document.getElementById('intervalBtns').addEventListener('click', e => {
    const btn = e.target.closest('.interval-btn');
    if (!btn) return;
    document.querySelectorAll('.interval-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.interval = btn.dataset.int;
    loadInterval();
  });

  // ===== 设置按钮 =====
  document.getElementById('btnSettings').addEventListener('click', () => openSettings());

  // ===== 下单模式按钮 =====
  document.getElementById('btnOrderMode').addEventListener('click', () => {
    state.orderMode = !state.orderMode;
    state.drawingMode = null;
    state.dragState = null;
    removePreviewSeries();
    document.getElementById('btnOrderMode').classList.toggle('active');
    toast(state.orderMode ? '📋 下单模式已开启，点击图表直接下单' : '下单模式已关闭', 'info');
  });

  // ===== 画线按钮 =====
  const drawBtnMap = { hline: 'btnDrawH', trend: 'btnDrawT', rect: 'btnDrawRect', fib: 'btnDrawFib' };
  const drawBtns = Object.values(drawBtnMap);

  function enterDrawMode(mode) {
    const prevMode = state.drawingMode;
    // 清除所有画线按钮的激活状态
    drawBtns.forEach(id => document.getElementById(id)?.classList.remove('active'));
    if (state.dragState) restoreDrawingColors(state.dragState);
    state.drawingMode = null;
    state.dragState = null;
    state.orderMode = false;
    document.getElementById('btnOrderMode')?.classList.remove('active');
    removePreviewSeries();
    // 如果点击的是同一个按钮，就是退出模式
    if (prevMode === mode) {
      toast('画线已取消', 'info');
      return;
    }
    state.drawingMode = mode;
    state.drawStart = null;
    document.getElementById(drawBtnMap[mode])?.classList.add('active');
  }

  function exitDrawMode() {
    if (state.dragState) restoreDrawingColors(state.dragState);
    state.drawingMode = null;
    state.drawStart = null;
    state.dragState = null;
    drawBtns.forEach(id => document.getElementById(id)?.classList.remove('active'));
    removePreviewSeries();
  }

  document.getElementById('btnDrawH').addEventListener('click', () => {
    enterDrawMode('hline');
    if (state.drawingMode === 'hline') toast('在图表上点击放置水平线', 'info');
  });
  document.getElementById('btnDrawT').addEventListener('click', () => {
    const wasActive = state.drawingMode === 'trend';
    enterDrawMode('trend');
    if (wasActive) return;
    if (state.drawingMode === 'trend') toast('点击起点，再点击终点', 'info');
  });
  document.getElementById('btnDrawRect').addEventListener('click', () => {
    const wasActive = state.drawingMode === 'rect';
    enterDrawMode('rect');
    if (wasActive) return;
    if (state.drawingMode === 'rect') toast('点击起点，再点击对角完成矩形', 'info');
  });
  document.getElementById('btnDrawFib').addEventListener('click', () => {
    const wasActive = state.drawingMode === 'fib';
    enterDrawMode('fib');
    if (wasActive) return;
    if (state.drawingMode === 'fib') toast('点击趋势起点，再点击趋势终点', 'info');
  });
  document.getElementById('btnClearDraw').addEventListener('click', clearDrawings);

  // ===== Escape 键取消画线 =====
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape' && !document.querySelector('.modal-overlay.show')) {
      if (state.drawingMode || state.dragState) {
        exitDrawMode();
        toast('已取消', 'info');
      }
      closeContextMenu();
    }
  });

  // ===== 右键菜单（画线） =====
  document.getElementById('chart-container').addEventListener('contextmenu', e => {
    closeContextMenu();
    if (!state.chart) return;
    // 通过图表坐标转换获取点击位置的价格和时间
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const price = state.candleSeries.coordinateToPrice(y);
    const time = state.chart.timeScale().coordinateToTime(x);
    if (price === null || !time) return;
    const hitIdx = hitTestDrawing(price, time);
    if (hitIdx === null) return;
    e.preventDefault();
    state._ctxDrawingIndex = hitIdx;
    const menu = document.getElementById('ctxMenu');
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('show');
  });

  // 点击菜单项
  document.getElementById('ctxMenu').addEventListener('click', e => {
    const item = e.target.closest('.ctx-item');
    if (!item) return;
    const action = item.dataset.action;
    if (action === 'delete' && state._ctxDrawingIndex !== null) {
      const idx = state._ctxDrawingIndex;
      const d = state.draws[idx];
      if (d) {
        const series = Array.isArray(d.series) ? d.series : [d.series];
        series.forEach(s => { try { state.chart.removeSeries(s); } catch (e) {} });
        state.draws.splice(idx, 1);
        toast('画线已删除', 'info');
      }
    } else if (action === 'clearall') {
      clearDrawings();
    }
    closeContextMenu();
  });

  // 点击其他地方关闭右键菜单
  document.addEventListener('click', e => {
    if (!e.target.closest('#ctxMenu')) closeContextMenu();
  });

  // ===== 回放控制按钮 =====
  document.getElementById('btnPlay').addEventListener('click',
    () => state.playing ? stopPlay() : startPlay());
  document.getElementById('btnNext').addEventListener('click',
    () => { stopPlay(); goTo(state.currentIndex + 1); });
  document.getElementById('btnPrev').addEventListener('click',
    () => { stopPlay(); goTo(state.currentIndex - 1); });

  // ===== 进度条 =====
  const slider = document.getElementById('progress');
  slider.addEventListener('input', () => {
    stopPlay();
    const visIdx = parseInt(slider.value);
    goTo(state.warmupOffset + visIdx);
  });

  // ===== 播放速度按钮 =====
  document.querySelectorAll('#controls button[data-speed]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#controls button[data-speed]')
        .forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.playSpeed = parseFloat(btn.dataset.speed);
    });
  });

  // ===== 随机跳转按钮 =====
  document.getElementById('btnRandom').addEventListener('click', jumpToRandom);

  // ===== 日期选择器跳转 =====
  document.getElementById('datePicker').addEventListener('change', e => {
    jumpToDate(e.target.value);
  });

  // ===== 键盘快捷键 =====
  document.addEventListener('keydown', e => {
    // 输入框内不触发快捷键
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.code) {
      case 'Space':       e.preventDefault(); state.playing ? stopPlay() : startPlay(); break;
      case 'ArrowRight':  stopPlay(); goTo(state.currentIndex + 1); break;
      case 'ArrowLeft':   stopPlay(); goTo(state.currentIndex - 1); break;
      case 'KeyL':        openTrade('long');  break;
      case 'KeyS':        openTrade('short'); break;
      case 'KeyC':        closeTrade();       break;
      case 'KeyR':        jumpToRandom();     break;
      case 'Delete':
      case 'Backspace':
        if (state.dragState) {
          deleteSelectedDrawing();
          e.preventDefault();
        }
        break;
    }
  });
});

// ║ 14. 应用初始化                                               ║
// ╚══════════════════════════════════════════════════════════════╝

/**
 * 初始化——依次：加载交易对 → 拉取K线 → 构建图表 → 渲染
 * 如果 API 请求失败，降级为模拟数据
 */
async function init() {
  console.log('[chart_replay] 开始初始化');

  // 从 localStorage 恢复上次的指标设置
  try {
    const saved = JSON.parse(localStorage.getItem('ct_indi_settings'));
    if (saved && typeof saved === 'object') {
      // 深度合并：只覆盖已有 key，不引入未知字段
      for (const key of Object.keys(state.indi)) {
        if (saved[key] && typeof saved[key] === 'object') {
          Object.assign(state.indi[key], saved[key]);
        }
      }
      console.log('[chart_replay] 已恢复缓存指标设置');
    }
  } catch (e) { /* 忽略 */ }

  document.getElementById('loading').classList.remove('hidden');

  // 1. 加载交易对列表
  document.getElementById('loading-msg').textContent = '正在加载交易对...';
  await loadSymbols();

  // 2. 获取K线数据
  document.getElementById('loading-msg').textContent = '正在获取 ' + state.symbol + ' K线数据...';
  try {
    await fetchKline();
  } catch (e) {
    console.warn('[chart_replay] API获取失败，使用模拟数据:', e.message);
    generateMockData();
  }

  // 3. 检查图表库是否加载
  document.getElementById('loading-msg').textContent = '初始化图表...';
  if (typeof LightweightCharts === 'undefined') {
    document.getElementById('loading-msg').textContent = '图表库未加载，请刷新页面';
    return;
  }

  // 4. 构建图表
  rebuildChart();
  updateDatePickerRange();

  // 5. 设置进度条和初始显示
  const totalVis = state.allData.length - state.warmupOffset;
  document.getElementById('progress').max = Math.max(0, totalVis - 1);
  goTo(state.currentIndex);
  updatePositionDisplay();
  updateHistory();

  // 6. 隐藏加载遮罩
  document.getElementById('loading').classList.add('hidden');
  console.log('[chart_replay] 初始化完成');
}

// 启动
window.addEventListener('DOMContentLoaded', init);
console.log('[chart_replay] 脚本加载完成，等待DOMContentLoaded');
</script>
</body>
</html>
